<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบจองห้องออนไลน์</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/Login.css">
    <link rel="stylesheet" href="../Layout/Responsive.css">
</head>

<body>
    <!-- ================= พื้นหลัง ================= -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
    </div>


    <!-- ================= Login Wrapper ================= -->
    <main class="login-wrapper">


        <!-- ================= Left Logo ================= -->
        <section class="logo-card">
            <div class="logo-glow"></div>
            <div class="logo-images">
                <img src="../src/images/Logo RMUTL.png" alt="ตรามหาวิทยาลัย" class="university-logo">
                <img src="../src/images/CPETC LOGO.png" alt="โลโก้แผนก" class="second-logo">
            </div>

            <h2>ระบบจองห้องแผนกวิศวกรรมคอมพิวเตอร์</h2>
            <p>RMUTL COMPUTER ENGINEER Online Room Booking</p>

            <span class="system-line"></span>

            <div class="logo-description"><i class="fa-solid fa-building"></i>
                <span>มหาวิทยาลัยเทคโนโลยีราชมงคลล้านนา ตาก</span>
            </div>
        </section>


        <!-- ================= Right Login ================= -->
        <section class="login-card">
            

            <!-- ================= Login Header ================= -->
            <div class="login-header">
                <div class="login-icon">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>

                <h1>เข้าสู่ระบบ</h1>
                <p>กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
            </div>


            <!-- ================= Form Login ================= -->
            <form id="loginForm" class="login-form" autocomplete="on">


                <!-- ================= OPTIONS ================= -->
                <div class="input-group">
                    <label for="email">อีเมล</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="กรอกอีเมล" autocomplete="email" required>
                    </div>
                </div>


                <!-- ================= Password ================= -->
                <div class="input-group">
                    <label for="password">รหัสผ่าน</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>

                        <button type="button" id="togglePassword" class="toggle-password" aria-label="แสดงรหัสผ่าน"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>


                <!-- ================= OPTIONS ================= -->

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>จดจำฉัน</span>
                    </label>

                    <a href="../reset-password//reset-password.html" id="forgotPasswordLink">ลืมรหัสผ่าน?</a>
                </div>


                <!-- ================= Login Button ================= -->
                <button type="submit" class="login-button"><span>เข้าสู่ระบบ</span><i class="fa-solid fa-arrow-right"></i></button>


                <!-- ================= Register ================= -->
                <div class="register-link">
                    <span>ยังไม่มีบัญชี?</span>

                    <a href="Register.html">สมัครสมาชิก</a>
                </div>
            </form>

            
            <!-- ================= FOOTER ================= -->
            <div class="login-footer">
                <span>© 2026 RMUTL COMPUTER ENGINEER Online Room Booking</span>
            </div>
        </section>
    </main>

    <script type="module" src="../JS/Login.js"></script>

</body>
</html>
